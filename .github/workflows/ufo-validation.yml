name: UFO on-chain validation

on:
  push:
    branches: [fix/friendly-space-travel]
    paths: [programs/game-state/src/ufo.rs, programs/game-state/src/lib.rs, .github/workflows/ufo-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ufo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Test game program with bounded build parallelism
        run: cargo test -p game-state --lib --locked --jobs 1
  sbf:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Download checksum-pinned Agave tools
        run: |
          curl --fail --location --retry 3 --output /tmp/agave.tar.bz2 https://github.com/anza-xyz/agave/releases/download/v3.1.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo '88df00f7c23f84aa627f9181f8231d2aa10ada7caa9ff5a7f7287b7ef7d0bbe8  /tmp/agave.tar.bz2' | sha256sum --check
          tar --extract --bzip2 --file /tmp/agave.tar.bz2 --directory /tmp
          echo '/tmp/solana-release/bin' >> "$GITHUB_PATH"
      - name: Build SBF with bounded parallelism
        run: |
          set -o pipefail
          cargo-build-sbf --manifest-path programs/game-state/Cargo.toml --sbf-out-dir target/deploy -- --locked --jobs 1 2>&1 | tee /tmp/ufo-sbf.log
          if grep -Ei 'stack offset.*exceeded|stack frame.*exceeded' /tmp/ufo-sbf.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ufo-game-state-sbf
          path: target/deploy/game_state.so
          if-no-files-found: error
          retention-days: 7
